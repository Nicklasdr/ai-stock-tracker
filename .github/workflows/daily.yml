name: Weekday Stock Digest

on:
  workflow_dispatch:
  schedule:
    # 16:30 America/New_York is 20:30 UTC during US daylight time,
    # and 21:30 UTC during US standard time. Guard in Python chooses the right run.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check Eastern time and run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess, sys
          now = datetime.now(ZoneInfo("America/New_York"))
          event = __import__("os").environ.get("GITHUB_EVENT_NAME", "schedule")
          if event == "workflow_dispatch" or (now.weekday() < 5 and now.hour == 16 and 20 <= now.minute <= 55):
              subprocess.check_call([sys.executable, "-m", "src.daily_report"])
          else:
              print(f"Skipping duplicate/off-window run: {now.isoformat()}")
          PY
